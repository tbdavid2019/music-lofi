<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="innerHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.20" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="116" ry="116" fill="url(#orangeGrad)" />
  <rect x="5" y="5" width="502" height="502" rx="111" ry="111" fill="none" stroke="url(#innerHighlight)" stroke-width="4.5" />

  <!-- Logo Graphics: 888 + Lucide eighth-notes -->
  <g filter="url(#subtleGlow)">
    <text x="256" y="215" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="148" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-3">888</text>

    <!-- Lucide eighth-notes icon (https://lucide.dev/icons/eighth-notes) -->
    <g transform="translate(166, 258) scale(7.5)" fill="none" stroke="#FFFFFF" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 16V3a1 1 0 0 0-1.28-.96l-10 2.917a1 1 0 0 0-.72.96V19" />
      <circle cx="18" cy="16" r="3" />
      <circle cx="6" cy="19" r="3" />
    </g>
  </g>
</svg>
